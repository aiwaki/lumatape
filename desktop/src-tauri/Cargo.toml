[package]
name = "lumatape-desktop"
version = "0.3.2"
description = "LumaTape CRT and VHS settings"
authors = ["aiwaki"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "lumatape"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "=2.9.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
base64 = "0.22"
minisign-verify = "=0.2.5"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "=0.2.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
