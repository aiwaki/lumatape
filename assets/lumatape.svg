<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LumaTape: television colour bars in a rounded square">
  <title>LumaTape</title>
  <defs>
    <clipPath id="screen">
      <rect x="6" y="6" width="52" height="52" rx="12"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="8" height="40" fill="#EBEBEB" clip-path="url(#screen)"/>
  <rect x="14" y="6" width="7" height="40" fill="#EBEB00" clip-path="url(#screen)"/>
  <rect x="21" y="6" width="7" height="40" fill="#00EBEB" clip-path="url(#screen)"/>
  <rect x="28" y="6" width="8" height="40" fill="#00CB00" clip-path="url(#screen)"/>
  <rect x="36" y="6" width="7" height="40" fill="#CB00CB" clip-path="url(#screen)"/>
  <rect x="43" y="6" width="7" height="40" fill="#EB0000" clip-path="url(#screen)"/>
  <rect x="50" y="6" width="8" height="40" fill="#0000CB" clip-path="url(#screen)"/>
  <rect x="6" y="46" width="17" height="12" fill="#111111" clip-path="url(#screen)"/>
  <rect x="23" y="46" width="18" height="12" fill="#EBEBEB" clip-path="url(#screen)"/>
  <rect x="41" y="46" width="17" height="12" fill="#111111" clip-path="url(#screen)"/>
