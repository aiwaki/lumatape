[package]
name = "lumatape-desktop"
version = "0.3.3"
description = "LumaTape CRT and VHS settings"
authors = ["aiwaki"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "lumatape"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "=2.9.0"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-opener = "=2.5.3"
winreg = "=0.55.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
base64 = "0.22"
minisign-verify = "=0.2.5"

[patch.crates-io]
# auto-launch 0.5.0 writes an unquoted executable into Windows Run. Keep the
# official Tauri plugin, with only the command construction corrected locally.
auto-launch = { path = "vendor/auto-launch" }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "=0.2.5"

[target.'cfg(windows)'.dev-dependencies]
auto-launch = "=0.5.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
