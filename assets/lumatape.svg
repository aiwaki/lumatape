<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LumaTape: television colour bars in a rounded square">
  <title>LumaTape</title>
  <defs>
    <clipPath id="screen">
      <rect x="6" y="6" width="52" height="52" rx="12"/>
    </clipPath>
  </defs>
  <rect x="6" y="6" width="13" height="52" fill="#F1CF43" clip-path="url(#screen)"/>
  <rect x="19" y="6" width="13" height="52" fill="#51CED0" clip-path="url(#screen)"/>
  <rect x="32" y="6" width="13" height="52" fill="#DE77C1" clip-path="url(#screen)"/>
  <rect x="45" y="6" width="13" height="52" fill="#777ED8" clip-path="url(#screen)"/>
</svg>
